[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pygis-viet-nam-guidebook"
version = "1.0.0"
description = "Trình tạo website tài liệu Phân tích GIS với Python bằng Python thuần"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Long Ngo" }]
keywords = ["python", "gis", "geopandas", "rasterio", "pyqgis", "việt-nam"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Vietnamese",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
kiem-thu = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
pygis-vn = "pygis_vn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pygis_vn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
